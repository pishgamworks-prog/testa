name: ASR Tiny Model
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-22.04
    steps:
      - name: Download model
        run: |
          curl -L --fail --retry 5 --retry-delay 10 -o ggml-tiny-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin
          test $(stat -c%s ggml-tiny-q5_1.bin) -gt 25000000
      - uses: actions/upload-artifact@v4
        with:
          name: asr-tiny-model
          path: ggml-tiny-q5_1.bin
          retention-days: 1
