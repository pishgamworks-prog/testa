name: ASR Base Model
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download model
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          test $(stat -c%s ggml-base-q5_1.bin) -gt 50000000
      - uses: actions/upload-artifact@v4
        with:
          name: asr-base-model
          path: ggml-base-q5_1.bin
          retention-days: 1
          if-no-files-found: error
