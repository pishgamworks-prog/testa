name: Prepare ASR Bundle

on:
  push:
    paths:
      - '.github/workflows/prepare-asr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare Whisper CLI and multilingual model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle
          curl -L --fail --retry 5 --retry-delay 5 \
            -o whisper-bin.tar.gz \
            https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.2/whisper-bin-ubuntu-x64.tar.gz
          tar -xzf whisper-bin.tar.gz
          find . -maxdepth 4 -type f -print
          cp -a whisper-bin-ubuntu-x64/. bundle/ || true
          if [ ! -x bundle/whisper-cli ]; then
            CLI=$(find . -type f -name whisper-cli -perm -111 | head -n 1)
            cp "$CLI" bundle/whisper-cli
          fi
          curl -L --fail --retry 5 --retry-delay 10 \
            -o bundle/ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          sha256sum bundle/* > bundle/SHA256SUMS.txt
          tar -czf asr-bundle-linux-x64.tar.gz -C bundle .

      - name: Upload ASR bundle
        uses: actions/upload-artifact@v4
        with:
          name: asr-bundle-linux-x64
          path: asr-bundle-linux-x64.tar.gz
          retention-days: 1
          if-no-files-found: error
